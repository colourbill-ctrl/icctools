<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      icctools is a no-network app: WASM modules are fetched from the same
      origin and instantiated via blob URLs (Vite + Emscripten pattern).
      Locking connect-src to 'self' preserves the "no exfiltration" property
      that justifies a permissive postMessage launch protocol — a future XSS
      regression can't phone home. 'wasm-unsafe-eval' is required by the
      Emscripten glue; 'blob:' covers our blob-URL imports for the glue mjs
      files and the WASM binaries.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" />
    <title>ICC Profile Tool</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
