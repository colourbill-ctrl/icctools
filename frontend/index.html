<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      profiletool is a near-no-network app: WASM modules are fetched from the
      same origin and instantiated via blob URLs (Vite + Emscripten pattern).
      Locking connect-src to 'self' preserved a "no exfiltration" property that
      justified the permissive postMessage launch protocol (an XSS regression
      couldn't phone home). 'wasm-unsafe-eval' is required by the Emscripten
      glue; 'blob:' covers our blob-URL imports for the glue mjs files and the
      WASM binaries.

      DELIBERATE EXCEPTION (analytics): the only off-origin SCRIPT host allowed
      is Google Analytics — googletagmanager.com (the gtag loader) on script-src;
      google-analytics.com / region1 are kept explicit on img-src (beacons). To
      keep the inline-script ban intact we do NOT allow 'unsafe-inline': the gtag
      loader is the external <script async> below and the init lives in bundled
      JS (src/lib/analytics.js), not an inline block.

      DELIBERATE WIDENING (url= launch, v1.1.5): connect-src now includes
      'https:' so the `#url=` launch fragment can fetch an ICC profile from any
      HTTPS host (subject to that host's CORS). This trades the former "no
      off-origin fetch" property for "https-only fetch": an XSS regression could
      now exfiltrate over https. We accept this for the URL-launch feature. The
      fetched bytes only flow into the WASM validator and are never re-sent. The
      postMessage allowedOrigins allowlist (src/App.jsx) still gates hostile
      INBOUND bytes — keep it strict. script-src is deliberately NOT widened.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com; connect-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" />
    <title>ICC Profile Tool</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WJN2XTVMG8"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
